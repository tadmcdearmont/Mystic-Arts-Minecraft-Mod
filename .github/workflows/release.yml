name: Build & Publish Mystic Arts Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Build Fabric 1.20.1 Mod JAR
        run: gradle build --no-daemon --stacktrace

      - name: Create Public GitHub Release & Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Mystic Arts Mod (Fabric 1.20.1) - v1.0.1"
          body: |
            ## Mystic Arts Mod for Minecraft 1.20.1 (Fabric) - v1.0.1
            Ascetic Monk Progression Remake of RWTema's The Monk Mod.

            ### Fixes in v1.0.1:
            - **Crafting Recipe**: Shapeless crafting (1 Book + 2 Lapis Lazuli + 1 Leather) yields Mystic Codex.
            - **Item Texture**: Resolved purple/black missing texture with enchanted glowing book model.
            - **Codex GUI**: Interactive dual-page GUI displaying 20 levels of ascetic lore, trials, live progress bars, unlocked perks, and vow status.
            - **Action Bar Feedback**: Punching logs bare-handed now shows real-time Action Bar HUD (`[Mystic Arts] Fist of Oak: X / 10 Logs`) with sound cues and level up fanfare!
          files: |
            build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
